[project]
name = "resolve-ingest"
version = "0.1.0"
description = "Bootstrap a DaVinci Resolve project from a folder of footage"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
resolve-ingest = "resolve_ingest.cli:main"

[project.gui-scripts]
resolve-ingest-gui = "resolve_ingest.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
